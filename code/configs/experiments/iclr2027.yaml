schema_version: "1.0"

experiment:
  id: paretoskill-iclr2027-v1
  config_version: 1
  title: Regression-aware multi-objective evolution of transferable agent skills
  mode: dry-run
  freeze_status: structural_protocol_only
  primary_benchmark: spreadsheetbench_verified
  minimum_search_seeds: 3
  notes: >-
    This manifest freezes the intended ICLR 2027 comparison. Real model revisions,
    data manifests, prices, and deployment thresholds remain explicit environment
    placeholders and must be resolved before a non-dry run.

runtime_profiles:
  dry_run:
    provider_override: mock
    data_adapter: builtin_synthetic_fixture
    resolve_external_placeholders: false
    network: false
    synthetic_only_values:
      accuracy_tolerance: 0.05
      token_budget: 4096
      archive_capacity: 32
      final_task_executions: 600
      results_root: runs/dry-run
  replay:
    provider_override: replay
    data_adapter: replay_manifest
    resolve_external_placeholders: false
    network: false
  real:
    provider_override: disabled_external
    data_adapter: configured_manifests
    resolve_external_placeholders: true
    network: false
    preflight_action: reject_checked_in_manifest
    requires_new_versioned_manifest: true
    required_experiment_mode_in_new_manifest: real
    required_network_value_in_new_manifest: true
    todo: >-
      Copy to a new manifest ID, set a coherent real mode/network/provider configuration,
      install a reviewed adapter, and obtain explicit authorization. This checked-in file
      must never become an online manifest in place.

safety:
  offline_by_default: true
  allow_network: false
  required_network_env: PARETOSKILL_ENABLE_NETWORK
  required_network_value: "I_UNDERSTAND_EXTERNAL_CALLS_MAY_COST_MONEY"
  fail_if_external_provider_unresolved: true
  fail_if_data_placeholder_unresolved: true
  placeholder_failure_scope: real_profile_only
  forbid_implicit_provider_fallback: true
  forbid_api_calls_in_dry_run: true
  allowed_dry_run_providers:
    - mock
    - replay

reproducibility:
  experiment_id_strategy: sha256_canonical_resolved_content_pinned_manifest
  reject_path_only_identity: true
  require_sha256_or_immutable_revision_for_external_inputs: true
  digest_verification: recompute_from_local_bytes_and_fail_on_mismatch_before_real_run
  identity_inputs:
    - task_manifest_digests
    - dataset_release_revisions
    - base_skill_content_digest
    - trace_store_digest
    - patch_pool_digest
    - verifier_adapter_digest
    - provider_adapter_digest
    - harness_adapter_digest
    - proposer_prompt_digest
    - materializer_revision_digest
    - dependency_lock_digest
    - sandbox_image_digest
    - execution_backend_digest
  dependency_lock:
    path: "${PARETOSKILL_DEPENDENCY_LOCK_PATH}"
    sha256: "${PARETOSKILL_DEPENDENCY_LOCK_SHA256}"
  execution_environment:
    serving_backend: "${PARETOSKILL_SERVING_BACKEND}"
    serving_backend_revision: "${PARETOSKILL_SERVING_BACKEND_REVISION}"
    serving_backend_sha256: "${PARETOSKILL_SERVING_BACKEND_SHA256}"
    hardware: "${PARETOSKILL_HARDWARE_DESCRIPTION}"
    driver_runtime: "${PARETOSKILL_DRIVER_RUNTIME}"
    deterministic_kernel_policy: "${PARETOSKILL_DETERMINISTIC_KERNEL_POLICY}"

providers:
  mock:
    kind: mock
    enabled: true
    network: false
    price:
      input_per_million_tokens: 0.0
      output_per_million_tokens: 0.0
      currency: USD
  replay:
    kind: replay
    enabled: true
    network: false
    replay_path: "${PARETOSKILL_REPLAY_PATH}"
    price:
      input_per_million_tokens: 0.0
      output_per_million_tokens: 0.0
      currency: USD
  disabled_external:
    kind: external_protocol
    enabled: false
    network: true
    adapter: "${PARETOSKILL_EXTERNAL_PROVIDER_ADAPTER}"
    adapter_revision: "${PARETOSKILL_EXTERNAL_PROVIDER_ADAPTER_REVISION}"
    adapter_sha256: "${PARETOSKILL_EXTERNAL_PROVIDER_ADAPTER_SHA256}"
    api_key_env: PARETOSKILL_PROVIDER_API_KEY
    base_url: "${PARETOSKILL_PROVIDER_BASE_URL}"
    price:
      input_per_million_tokens: "${PARETOSKILL_INPUT_PRICE_PER_MILLION}"
      output_per_million_tokens: "${PARETOSKILL_OUTPUT_PRICE_PER_MILLION}"
      currency: "${PARETOSKILL_PRICE_CURRENCY}"
      source_url: "${PARETOSKILL_PRICE_SOURCE_URL}"
      retrieved_at_utc: "${PARETOSKILL_PRICE_RETRIEVED_AT_UTC}"
    todo: Freeze a real provider adapter and dated public price source before the first main run.

models:
  skill_author:
    provider: disabled_external
    model_id: "${PARETOSKILL_AUTHOR_MODEL_ID}"
    revision: "${PARETOSKILL_AUTHOR_MODEL_REVISION}"
    role: proposer
    decoding:
      temperature: 0.0
      top_p: 1.0
      max_output_tokens: "${PARETOSKILL_AUTHOR_MAX_OUTPUT_TOKENS}"
  skill_user_small:
    provider: disabled_external
    model_id: "${PARETOSKILL_USER_SMALL_MODEL_ID}"
    revision: "${PARETOSKILL_USER_SMALL_MODEL_REVISION}"
    role: evaluator
    family_partition: source_family
    decoding:
      temperature: 0.0
      top_p: 1.0
      max_output_tokens: "${PARETOSKILL_USER_MAX_OUTPUT_TOKENS}"
  skill_user_large:
    provider: disabled_external
    model_id: "${PARETOSKILL_USER_LARGE_MODEL_ID}"
    revision: "${PARETOSKILL_USER_LARGE_MODEL_REVISION}"
    role: evaluator
    family_partition: source_family
    decoding:
      temperature: 0.0
      top_p: 1.0
      max_output_tokens: "${PARETOSKILL_USER_MAX_OUTPUT_TOKENS}"
  heldout_family:
    provider: disabled_external
    model_id: "${PARETOSKILL_HELDOUT_MODEL_ID}"
    revision: "${PARETOSKILL_HELDOUT_MODEL_REVISION}"
    role: final_transfer_only
    family_partition: heldout_family
    decoding:
      temperature: 0.0
      top_p: 1.0
      max_output_tokens: "${PARETOSKILL_USER_MAX_OUTPUT_TOKENS}"

harnesses:
  spreadsheet_primary:
    adapter: "${PARETOSKILL_SPREADSHEET_HARNESS_ADAPTER}"
    repository_revision: "${PARETOSKILL_SPREADSHEET_HARNESS_REVISION}"
    adapter_sha256: "${PARETOSKILL_SPREADSHEET_HARNESS_SHA256}"
    max_tool_steps: "${PARETOSKILL_MAX_TOOL_STEPS}"
    sandbox_image: "${PARETOSKILL_SANDBOX_IMAGE}"
    sandbox_image_digest: "${PARETOSKILL_SANDBOX_IMAGE_DIGEST}"
  spreadsheet_alternate:
    adapter: "${PARETOSKILL_ALTERNATE_HARNESS_ADAPTER}"
    repository_revision: "${PARETOSKILL_ALTERNATE_HARNESS_REVISION}"
    adapter_sha256: "${PARETOSKILL_ALTERNATE_HARNESS_SHA256}"
    max_tool_steps: "${PARETOSKILL_MAX_TOOL_STEPS}"
    sandbox_image: "${PARETOSKILL_SANDBOX_IMAGE}"
    sandbox_image_digest: "${PARETOSKILL_SANDBOX_IMAGE_DIGEST}"
    todo: Freeze only after the alternate harness reproduces its documented base ordering.

domains:
  spreadsheet_verified:
    task_type: spreadsheet_manipulation
    adapter: "${PARETOSKILL_SPREADSHEET_DOMAIN_ADAPTER}"
    adapter_revision: "${PARETOSKILL_SPREADSHEET_DOMAIN_ADAPTER_REVISION}"
    adapter_sha256: "${PARETOSKILL_SPREADSHEET_DOMAIN_ADAPTER_SHA256}"
  spreadsheet_full:
    task_type: spreadsheet_manipulation
    adapter: "${PARETOSKILL_SPREADSHEET_DOMAIN_ADAPTER}"
    adapter_revision: "${PARETOSKILL_SPREADSHEET_DOMAIN_ADAPTER_REVISION}"
    adapter_sha256: "${PARETOSKILL_SPREADSHEET_DOMAIN_ADAPTER_SHA256}"
  wikitablequestions_converted:
