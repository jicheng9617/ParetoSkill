    adapter: "${PARETOSKILL_HITAB_DOMAIN_ADAPTER}"
    adapter_revision: "${PARETOSKILL_HITAB_DOMAIN_ADAPTER_REVISION}"
    adapter_sha256: "${PARETOSKILL_HITAB_DOMAIN_ADAPTER_SHA256}"

datasets:
  spreadsheetbench_verified:
    root: "${PARETOSKILL_SPREADSHEETBENCH_VERIFIED_ROOT}"
    manifest: "${PARETOSKILL_SPREADSHEETBENCH_VERIFIED_MANIFEST}"
    release_revision: "${PARETOSKILL_SPREADSHEETBENCH_VERIFIED_REVISION}"
    manifest_sha256: "${PARETOSKILL_SPREADSHEETBENCH_VERIFIED_MANIFEST_SHA256}"
    canonical_task_id_namespace: spreadsheetbench
    total_tasks: 400
  spreadsheetbench_full:
    root: "${PARETOSKILL_SPREADSHEETBENCH_FULL_ROOT}"
    manifest: "${PARETOSKILL_SPREADSHEETBENCH_FULL_MANIFEST}"
    release_revision: "${PARETOSKILL_SPREADSHEETBENCH_FULL_REVISION}"
    manifest_sha256: "${PARETOSKILL_SPREADSHEETBENCH_FULL_MANIFEST_SHA256}"
    canonical_task_id_namespace: spreadsheetbench
