    manifest_sha256: "${PARETOSKILL_HITAB_MANIFEST_SHA256}"
    canonical_task_id_namespace: hitab
    total_tasks: null
    todo: Resolve search/test conversion manifests without overlapping task IDs.

splits:
  evolution_trace:
    dataset: spreadsheetbench_verified
    source_partition: evolution
    expected_count: 160
    use: trace_collection_and_patch_generation
    manifest: "${PARETOSKILL_EVOLUTION_TRACE_MANIFEST}"
    manifest_sha256: "${PARETOSKILL_EVOLUTION_TRACE_MANIFEST_SHA256}"
    test_access: false
  id_validation:
    dataset: spreadsheetbench_verified
    source_partition: evolution
    expected_count: 40
    use: search_and_selection
    manifest: "${PARETOSKILL_ID_VALIDATION_MANIFEST}"
    manifest_sha256: "${PARETOSKILL_ID_VALIDATION_MANIFEST_SHA256}"
    disjoint_from:
      - evolution_trace
      - heldout_verified
    test_access: false
  heldout_verified:
    dataset: spreadsheetbench_verified
    source_partition: heldout
    expected_count: 200
    use: final_evaluation_only
    manifest: "${PARETOSKILL_HELDOUT_VERIFIED_MANIFEST}"
    manifest_sha256: "${PARETOSKILL_HELDOUT_VERIFIED_MANIFEST_SHA256}"
    disjoint_from:
      - evolution_trace
      - id_validation
    test_access: true
  wtq_transfer_validation:
    dataset: wikitablequestions_converted
    expected_count: 40
    use: search_transfer_stratum
    manifest: "${PARETOSKILL_WTQ_VALIDATION_MANIFEST}"
    manifest_sha256: "${PARETOSKILL_WTQ_VALIDATION_MANIFEST_SHA256}"
    disjoint_from:
      - wtq_untouched_test
    test_access: false
  wtq_untouched_test:
    dataset: wikitablequestions_converted
    expected_count: null
    use: final_evaluation_only
    manifest: "${PARETOSKILL_WTQ_TEST_MANIFEST}"
    manifest_sha256: "${PARETOSKILL_WTQ_TEST_MANIFEST_SHA256}"
    test_access: true
  hitab_transfer_validation:
    dataset: hitab_converted
    expected_count: 40
    use: search_transfer_stratum
    manifest: "${PARETOSKILL_HITAB_VALIDATION_MANIFEST}"
    manifest_sha256: "${PARETOSKILL_HITAB_VALIDATION_MANIFEST_SHA256}"
    disjoint_from:
      - hitab_untouched_test
    test_access: false
  hitab_untouched_test:
    dataset: hitab_converted
    expected_count: null
    use: final_evaluation_only
    manifest: "${PARETOSKILL_HITAB_TEST_MANIFEST}"
    manifest_sha256: "${PARETOSKILL_HITAB_TEST_MANIFEST_SHA256}"
    test_access: true
  spreadsheetbench_full_test:
    dataset: spreadsheetbench_full
    expected_count: null
    use: final_evaluation_only
    manifest: "${PARETOSKILL_SPREADSHEETBENCH_FULL_TEST_MANIFEST}"
    manifest_sha256: "${PARETOSKILL_SPREADSHEETBENCH_FULL_TEST_MANIFEST_SHA256}"
    overlap_with_verified: allowed_only_via_canonical_task_identity
    reuse_identical_verified_execution: true
    report_separately_from_verified: true
    forbid_double_weighting_in_pooled_metrics: true
    required_overlap_strata:
      - evolution_trace_seen
      - id_validation_seen
      - heldout_verified
      - full_collection_only
    test_access: true

task_seed_blocks:
  outcome_cache_keys:
    - split_id
    - canonical_task_id
    - target_id
    - execution_seed
  archive_bootstrap_cluster_keys:
    - split_id
    - canonical_task_id
    - execution_seed
  archive_bootstrap_retain_all_targets_in_cluster: true
  archive_bootstrap_strata:
    - split_id
    - transfer_group
  final_comparison_cluster_keys:
    - dataset_id
    - canonical_task_id
  final_comparison_retain_all_execution_seeds: true
  final_comparison_retain_compatible_targets: true
  paired_against_base: true
  shared_across_candidates: true
  shared_across_methods: true
  assignment: stable_hash_then_lexicographic
  assignment_hash: sha256
  assignment_salt: paretoskill-iclr2027-screen-v1
  screen_execution_seeds:
    - 17
  search_seeds:
    - 104729
    - 130363
    - 155921
  execution_seeds:
    - 17
    - 29
    - 43
  bootstrap_seed: 32452843
  infrastructure_retry_uses_same_seed: true
  retry_limit: 1
  exclude_only_verified_infrastructure_failures: true
  failure_taxonomy:
    eligible_for_retry_and_exclusion:
      - sandbox_start_failure
      - provider_transport_failure_before_response
      - harness_crash_before_agent_output
      - verifier_infrastructure_failure
    never_exclude_as_infrastructure:
      - model_refusal
      - invalid_agent_output
      - tool_misuse
      - task_timeout_after_valid_start
      - verifier_assertion_failure
    adjudication: verifier_confirmed_with_logged_raw_evidence
    missing_failed_excluded_reported_separately: true

