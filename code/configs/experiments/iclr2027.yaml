    adapter: "${PARETOSKILL_WTQ_DOMAIN_ADAPTER}"
    adapter_revision: "${PARETOSKILL_WTQ_DOMAIN_ADAPTER_REVISION}"
    adapter_sha256: "${PARETOSKILL_WTQ_DOMAIN_ADAPTER_SHA256}"
  hitab_converted:
