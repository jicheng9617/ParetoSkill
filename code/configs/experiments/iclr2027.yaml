    split: hitab_untouched_test
    phase: final_only
    transfer_group: domain_hitab

objectives:
  id_accuracy:
    enabled: true
    direction: maximize
    estimator: mean_binary_success
    target_ids:
      - id_small_primary
    pessimistic_bound: lower
  worst_target_transfer:
    enabled: true
    direction: maximize
    estimator: minimum_group_mean_binary_success
    target_ids:
      - cross_scale_large
      - cross_harness_small
      - ood_wtq_small
      - ood_hitab_small
    pessimistic_bound: lower
  token_cost:
    enabled: true
    direction: minimize
    estimator: mean_input_plus_output_tokens
    include_skill_injection_tokens: true
    include_agent_trajectory_tokens: true
    target_ids:
      - id_small_primary
      - cross_scale_large
      - cross_harness_small
      - ood_wtq_small
      - ood_hitab_small
    pessimistic_bound: upper
  paired_regression:
    enabled: true
    direction: minimize
    estimator: conditional_pass_to_fail_rate
    condition: base_success_equals_one
    zero_denominator: undefined
    target_ids:
      - id_small_primary
      - cross_scale_large
      - cross_harness_small
      - ood_wtq_small
      - ood_hitab_small
    pessimistic_bound: upper

constraints:
  enabled: true
  id_accuracy_floor:
    expression: lcb(candidate_id_accuracy-base_id_accuracy) >= -epsilon
    estimator: paired_candidate_minus_base_accuracy_delta
    pairing_cluster_keys:
      - split_id
      - canonical_task_id
      - execution_seed
    candidate_target_id: id_small_primary
    base_target_id: id_small_primary
    epsilon: "${PARETOSKILL_ACCURACY_TOLERANCE}"
    conservative_bound: true
  token_budget:
    expression: candidate_token_cost <= budget
    budget: "${PARETOSKILL_TOKEN_BUDGET}"
    conservative_bound: true
  unresolved_constraint_action: fail_before_real_run

statistics:
  paired_design: true
  archive_resampling_unit: split_task_seed_cluster
  final_resampling_unit: dataset_task_cluster
  interval_method: paired_stratified_bootstrap
  bootstrap_replicates: 10000
  minimum_effective_blocks_for_archive: 2
  confidence_level: 0.95
  one_sided_archive_bounds: true
  benefit_bound: lower
  cost_bound: upper
  regression_bound: upper
  dominance:
    primary: pessimistic_bounds
    weak_all_strict_one: true
    feasibility_checked_before_dominance: true
  heldout_comparisons:
    interval: paired_two_sided_bootstrap
    cluster: dataset_task
    multiplicity_correction: holm
    report_search_seed_distribution: true
    require_all_declared_search_seeds: true
    primary_endpoint: feasible_hypervolume_at_30000_logical_task_executions
    holm_family:
      contrast: paretoskill_vs_each_declared_matched_run
      matched_run_ids:
        - simple_patch_composition
        - trace2skill_accuracy_subset
        - fixed_scalarization_accuracy_only
        - fixed_scalarization_accuracy_cost_equal
        - fixed_scalarization_balanced_four_objective
        - fixed_scalarization_ctx2skill_hard_easy_product
        - evoskill_scalar_topk
        - skillmoo_nsga2
        - mocha_chebyshev_hvc
        - passive_archive
      secondary_metrics_are_exploratory: true
  worst_group_sensitivity:
    alternative: lower_tail_cvar
    alpha: 0.25
  hypervolume_reference:
    source: frozen_base_and_no_skill_pilot
    normalized_maximize_point:
      - 0.0
      - 0.0
      - 0.0
      - 0.0
    manifest: "${PARETOSKILL_HV_REFERENCE_MANIFEST}"
    freeze_before_method_comparison: true
  false_admission_reference: full_validation_pessimistic_archive

budgets:
  accounting_unit: task_executions
  matched_budget_uses_logical_executions: true
  cross_method_cache_hit_consumes_logical_budget: true
  physical_cache_savings_reported_separately: true
  matched_across_search_methods: true
  proposal_count_is_not_a_budget: true
  screen:
    task_executions: 40
    tasks_per_target: 8
    execution_seeds_per_task: 1
    selected_execution_seeds:
      - 17
    selection_hash: sha256
    selection_salt: paretoskill-iclr2027-screen-v1
    target_ids:
      - id_small_primary
      - cross_scale_large
      - cross_harness_small
      - ood_wtq_small
      - ood_hitab_small
    early_stop: conservative_feasibility_impossible
    early_stop_decision_timing: after_complete_40_execution_screen
    is_subset_of_full_matrix: true
  full:
    task_executions: 600
    task_executions_including_screen_subset: 600
    incremental_task_executions_after_screen: 560
    tasks_per_target: 40
    execution_seeds_per_task: 3
    target_ids:
      - id_small_primary
      - cross_scale_large
      - cross_harness_small
      - ood_wtq_small
      - ood_hitab_small
    promotion: feasible_or_confidence_boundary
  search_total_per_method:
    task_executions: 30000
    maximum_unique_screened_candidates: 386
    screen_allocation_task_executions: 15440
    maximum_promoted_candidates: 26
    incremental_promotion_allocation_task_executions: 14560
    allocation_sum_check: 30000
    primary_comparison_requires_exact_budget: true
    unused_promotion_allocation_action: report_mark_run_incomplete_and_do_not_reassign_after_outcomes
    budget_curve_task_executions:
      - 7500
      - 15000
      - 22500
      - 30000
  final:
    task_executions: "${PARETOSKILL_FINAL_TASK_EXECUTIONS}"
    allocation: all_unique_manifest_task_target_seed_executions
    canonical_execution_deduplication_keys:
      - canonical_task_id
      - model_revision
      - harness_revision
      - domain_adapter_revision
      - verifier_revision
      - execution_seed
    reuse_verified_rows_in_full_collection_when_keys_match: true
    report_verified_and_full_collection_separately: true
    forbid_double_weighting_overlapping_tasks_in_pooled_metrics: true
    candidates: frozen_archive_plus_baseline_outputs
    final_target_ids:
      - final_verified_small
      - final_verified_large
      - final_verified_heldout_family
      - final_verified_alternate_harness
      - final_spreadsheetbench_full
      - final_wtq
      - final_hitab
    test_access_after_search_freeze_only: true
    todo: Resolve from frozen final manifests; do not subsample after seeing outcomes.

shared_search_controls:
  base_skill: "${PARETOSKILL_BASE_SKILL_PATH}"
  base_skill_sha256: "${PARETOSKILL_BASE_SKILL_SHA256}"
  trace_store: "${PARETOSKILL_TRACE_STORE_PATH}"
  trace_store_sha256: "${PARETOSKILL_TRACE_STORE_SHA256}"
  patch_pool: "${PARETOSKILL_PATCH_POOL_PATH}"
  patch_pool_sha256: "${PARETOSKILL_PATCH_POOL_SHA256}"
  verifier: "${PARETOSKILL_VERIFIER_ADAPTER}"
  verifier_revision: "${PARETOSKILL_VERIFIER_REVISION}"
  verifier_sha256: "${PARETOSKILL_VERIFIER_SHA256}"
  candidate_generator: common_evidence_grounded_generator
  deterministic_materialization: true
  materializer:
    implementation: paretoskill_deterministic_materializer
    version: paretoskill-materializer/v1
    source_sha256: "${PARETOSKILL_MATERIALIZER_SHA256}"
    prompt: none
    canonicalization_version: paretoskill-canonical-v1
    content_hash: sha256
    patch_order:
      - patch_sequence_ascending
      - patch_id_lexicographic
  content_hash_deduplication: true
  reuse_cached_task_executions: true
  static_gate_before_evaluation: true
  patch_operations:
    - add
    - drop
    - rewrite
    - compress
  initial_population:
    - base
    - validated_singletons
    - full_merge
    - simple_diverse_subsets
    - compressed_variants

proposer:
  adapter: protocol_only
  model: skill_author
  enabled_in_dry_run: false
  mock_mutations_in_dry_run: true
  require_trace_evidence: true
  require_parent_version: true
  verifier_evidence_visible: true
  evidence_context: objective_specific
  parent_lineage_visible: true
  ancestral_patch_history_visible: true
  adapter_revision: "${PARETOSKILL_PROPOSER_ADAPTER_REVISION}"
  adapter_sha256: "${PARETOSKILL_PROPOSER_ADAPTER_SHA256}"
  prompt_template: "${PARETOSKILL_PROPOSER_PROMPT_PATH}"
  prompt_sha256: "${PARETOSKILL_PROPOSER_PROMPT_SHA256}"
  prompt_schema_version: paretoskill-proposer-v1
  allowed_operations:
    - add
    - drop
    - rewrite
    - compress

methods:
  no_skill:
    family: control
    comparison_role: fixed_control
    search: none
    artifact: empty_skill
  base_skill:
    family: control
    comparison_role: fixed_control
    search: none
    artifact: configured_base_skill
  simple_patch_composition:
    family: random_or_simple
    comparison_role: matched_search
    logical_task_execution_budget_per_search_seed: 30000
    search: seeded_bernoulli_patch_subsets
    inclusion_probability: 0.5
    force_nonempty_subset: true
    rng_seed: search_seed
    duplicate_tie_break: content_hash_lexicographic
    maximum_consecutive_duplicate_proposals: 1000
    selection: best_feasible_id_accuracy_then_tokens
  trace2skill_all:
    family: trace2skill_style
    comparison_role: fixed_candidate_baseline
    search: hierarchical_full_merge
    consolidation_order: evidence_cluster_then_patch_id_lexicographic
    conflict_resolution: shared_deterministic_materializer
    selection: single_full_merge
  trace2skill_accuracy_subset:
    family: trace2skill_style
    comparison_role: matched_search
    logical_task_execution_budget_per_search_seed: 30000
    search: binary_patch_subset
    optimizer_adapter: "${PARETOSKILL_BINARY_BO_ADAPTER}"
    optimizer_adapter_revision: "${PARETOSKILL_BINARY_BO_ADAPTER_REVISION}"
    optimizer_adapter_sha256: "${PARETOSKILL_BINARY_BO_ADAPTER_SHA256}"
    optimizer_protocol:
      surrogate: gaussian_process
      kernel: matern_5_2
      acquisition: expected_improvement
      initial_design: 20_seeded_unique_bernoulli_half_subsets
      batch_size: 1
      rng_seed: search_seed
      duplicate_policy: reject_and_resample
      maximum_consecutive_duplicate_proposals: 1000
    selection: id_accuracy_only
    feasibility_gate_affects_reporting_not_scalar_score: true
  fixed_scalarization:
    family: scalar
    comparison_role: independently_budgeted_matched_runs
    search: common_candidates
    objective_normalization: frozen_pilot_min_max
    zero_range_normalized_value: 0.0
    tie_break_order:
      - higher_id_accuracy
      - lower_paired_regression
      - lower_token_cost
      - content_hash_lexicographic
    variants:
      - id: accuracy_only
        run_id: fixed_scalarization_accuracy_only
        logical_task_execution_budget_per_search_seed: 30000
        score: id_accuracy
        maximize_space_weights:
          - 1.0
          - 0.0
          - 0.0
          - 0.0
      - id: accuracy_cost_equal
        run_id: fixed_scalarization_accuracy_cost_equal
        logical_task_execution_budget_per_search_seed: 30000
        score: 0.5*id_accuracy_normalized-0.5*token_cost_normalized
        maximize_space_weights:
          - 0.5
          - 0.0
          - 0.5
          - 0.0
      - id: balanced_four_objective
        run_id: fixed_scalarization_balanced_four_objective
        logical_task_execution_budget_per_search_seed: 30000
        score: 0.25*id_accuracy_normalized+0.25*worst_transfer_normalized-0.25*token_cost_normalized-0.25*paired_regression_normalized
        maximize_space_weights:
          - 0.25
          - 0.25
          - 0.25
          - 0.25
      - id: ctx2skill_hard_easy_product
        run_id: fixed_scalarization_ctx2skill_hard_easy_product
        logical_task_execution_budget_per_search_seed: 30000
        score: hard_probe_success_rate*easy_probe_success_rate
        candidate_space: common_primary_spreadsheet_patch_candidates
        task_statistic: base_mean_success_across_execution_seeds
        hard_probe: bottom_quartile_base_task_statistic_on_id_validation
        easy_probe: top_quartile_base_task_statistic_on_id_validation
        tasks_per_probe: 10
        tie_break: canonical_task_id_lexicographic
        require_disjoint_probes: true
        note: >-
          Fixed-product Cross-Time Replay selection-rule adaptation on primary candidates;
          CL-bench historical versions require a separate auxiliary manifest.
  evoskill_scalar_topk:
    family: evoskill_style
    comparison_role: matched_style_adaptation
    logical_task_execution_budget_per_search_seed: 30000
    search: iterative_common_candidate_generation
    admission: scalar_id_validation_score_top_k
    scalar_score: id_accuracy
    top_k: 26
    top_k_rationale: fills the frozen 26-candidate full-promotion allocation under the matched 30000-execution budget
    admission_tie_break: content_hash_lexicographic
    final_selection: highest_scalar_score
  skillmoo_nsga2:
    family: skillmoo_adaptation
    comparison_role: matched_search
    logical_task_execution_budget_per_search_seed: 30000
    search: nsga2_over_patch_compositions
    objectives: all_four
    population_size: 20
    offspring_size: 20
    initialization: common_seeded_initial_population_then_seeded_unique_subsets
    parent_selection: binary_tournament_rank_then_crowding
    tournament_size: 2
    crossover:
      kind: uniform_binary
      probability: 0.9
      per_locus_parent_probability: 0.5
    mutation:
      kind: independent_bit_flip
      per_locus_probability: reciprocal_patch_pool_size
    elitism: parent_plus_offspring
    generations: budget_limited
    rng_seed: search_seed
    tie_break: content_hash_lexicographic
    survivor_selection: nondominated_sort_and_crowding_distance
  mocha_chebyshev_hvc:
    family: mocha_adaptation
    comparison_role: matched_search
    logical_task_execution_budget_per_search_seed: 30000
    search: chebyshev_annealing_over_common_candidates
    objectives: all_four
    objective_normalization: frozen_pilot_min_max
    protocol:
      weight_sampling: seeded_symmetric_dirichlet_over_four_objectives
      dirichlet_alpha: 1.0
      parent_selection: minimum_normalized_chebyshev_distance_to_ideal
      exploration_metric: exact_hypervolume_contribution
      acceptance_schedule: hvc_to_chebyshev_by_logical_budget_fraction
      hvc_probability: exp(-annealing_rate*logical_budget_fraction)
      annealing_rate: 4.0
      chebyshev_acceptance: proposal_not_worse_than_best_incumbent_for_sampled_weights
    rng_seed: search_seed
    tie_break: content_hash_lexicographic
  passive_archive:
    family: pareto_control
    comparison_role: matched_search
    logical_task_execution_budget_per_search_seed: 30000
    search: common_unconditioned_candidate_stream
    working_archive: bounded_pessimistic_nondominated
    scientific_front: unbounded_reconstructed_pessimistic_nondominated
    generation_conditioned_on_archive: false
  paretoskill:
    family: proposed
    comparison_role: matched_search
    logical_task_execution_budget_per_search_seed: 30000
    search: archive_conditioned_patch_evolution
    working_archive: bounded_pessimistic_nondominated
    scientific_front: unbounded_reconstructed_pessimistic_nondominated
    proposal_batch_size: 4
    parent_selection:
      rule: maximum_sparse_region_crowding_distance
      preserve_objective_extremes: true
      tie_break: content_hash_lexicographic
    direction_selection:
      rule: least_covered_normalized_objective_direction
      tie_break_order:
        - id_accuracy
        - worst_target_transfer
        - token_cost
        - paired_regression
    mutation_operator_selection:
      initial_weights:
        add: 0.25
        drop: 0.25
        rewrite: 0.25
        compress: 0.25
      tie_break_order:
        - add
        - drop
        - rewrite
        - compress
      adaptation: none_in_primary_protocol
    generation_conditioned_on_archive: true
    proposer_predictions_used_as_scores: false

ablations:
  - id: no_uncertainty_bounds
    base_method: paretoskill
    overrides:
      statistics.dominance.primary: point_estimates
      statistics.one_sided_archive_bounds: false
      constraints.id_accuracy_floor.conservative_bound: false
      constraints.id_accuracy_floor.expression: point(candidate_id_accuracy-base_id_accuracy) >= -epsilon
  - id: no_regression_objective
    base_method: paretoskill
    overrides:
      objectives.paired_regression.enabled: false
  - id: no_transfer_objective
    base_method: paretoskill
    overrides:
      objectives.worst_target_transfer.enabled: false
  - id: passive_archive
    base_method: paretoskill
    overrides:
      methods.paretoskill.generation_conditioned_on_archive: false
  - id: no_feasibility_gate
    base_method: paretoskill
    overrides:
      constraints.enabled: false
  - id: evidence_blind_generation
    base_method: paretoskill
    overrides:
      proposer.evidence_context: failure_labels_only
      proposer.verifier_evidence_visible: false
    note: Evidence IDs remain recorded for audit; only proposer evidence is ablated.
  - id: lineage_blind_generation
    base_method: paretoskill
    overrides:
      proposer.parent_lineage_visible: false
      proposer.ancestral_patch_history_visible: false
    note: Lineage is still recorded for reproducibility but hidden from generation.
  - id: patch_subset_only
    base_method: paretoskill
    overrides:
      shared_search_controls.patch_operations:
        - add
        - drop

metrics:
  primary:
    - id_accuracy
    - worst_target_transfer
    - token_cost
    - paired_regression
    - feasible_hypervolume
  frontier:
    - feasible_coverage
    - additive_epsilon_indicator
    - inverted_generational_distance_to_pooled_empirical_front
    - scientific_front_size
    - working_archive_size
    - working_archive_churn
    - archive_size
    - archive_churn
    - false_archive_admissions
  efficiency:
    - task_executions
    - search_input_tokens
    - search_output_tokens
    - search_wall_clock_seconds
    - deployment_token_cost
    - break_even_reuse_count
    - budget_curve_feasible_hypervolume
  diagnostic:
    - feasibility_rate
    - repair_rate
    - pass_to_fail_count
    - failure_to_pass_count
    - latency_seconds
    - pairwise_objective_correlations
    - fraction_nondominated
    - operation_acceptance_by_type
    - evidence_type_acceptance

selection_protocol:
  search_uses_final_splits: false
  promote_screened_candidate_when:
    - conservatively_feasible
    - confidence_interval_crosses_feasibility_boundary
    - potentially_nondominated_under_interval_overlap
  working_archive:
    role: bounded_online_search_state
    admission:
      require_conservative_feasibility: true
      require_not_robustly_dominated: true
      content_hash_deduplicate: true
    capacity:
      max_entries: "${PARETOSKILL_ARCHIVE_CAPACITY}"
      overflow_policy: preserve_extremes_then_crowding_distance
  scientific_front:
    role: unbounded_reconstructed_scientific_output
    reconstruct_from: every_fully_evaluated_candidate
    capacity: null
    require_conservative_feasibility: true
    require_not_robustly_dominated: true
    content_hash_deduplicate: true
    compute_frontier_metrics_from_this_front: true
  archive_admission:
    compatibility_alias_for: working_archive.admission
    require_conservative_feasibility: true
    require_not_robustly_dominated: true
    content_hash_deduplicate: true
  archive_capacity:
    compatibility_alias_for: working_archive.capacity
    max_entries: "${PARETOSKILL_ARCHIVE_CAPACITY}"
    overflow_policy: preserve_extremes_then_crowding_distance
  stop_when:
    - matched_task_execution_budget_exhausted
  freeze_before_final:
    - working_archive
    - reconstructed_scientific_front
    - baseline_selected_outputs
    - normalization_constants
    - hypervolume_reference
    - deployment_policy_parameters

deployment:
  primary_policy: max_worst_transfer_under_token_budget
  policies:
    - id: min_tokens_subject_to_accuracy_floor
      tune_on: validation_only
    - id: max_worst_transfer_under_token_budget
      token_budget: "${PARETOSKILL_TOKEN_BUDGET}"
      tune_on: validation_only
    - id: normalized_knee_point
      normalization: frozen_validation_ranges
      tune_on: validation_only
  report_all_policies: true
  never_tune_on_final_test: true
  tie_break_order:
    - lower_paired_regression
    - lower_token_cost
    - content_hash_lexicographic

outputs:
  root: "${PARETOSKILL_RESULTS_ROOT}"
  experiment_id_strategy: sha256_canonical_resolved_content_pinned_manifest
  include_git_state: true
  runtime_metadata_capture:
    mode: explicit_allowlist_only
    fields:
      - python_version
      - operating_system
      - architecture
      - locale
      - timezone
      - process_start_utc
    environment_variable_allowlist:
      - PYTHONHASHSEED
    dump_process_environment: false
    heuristic_secret_redaction: false
  write_task_level_outcomes: true
  write_archive_snapshots: true
  write_lineage: true
  write_token_accounting: true
  checkpoint_policy:
    adaptive_methods: after_each_completed_ask_tell_batch
    static_methods: per_execution_content_cache_plus_completed_method_checkpoint
    root_contract: after_each_completed_invocation
  resume_from_cache: true
  required_files:
    - resolved_manifest.yaml
    - run_metadata.json
    - task_outcomes.jsonl
    - candidates.jsonl
    - archive.json
    - scientific_front.json
    - lineage.jsonl
    - metrics.json
    - token_accounting.json
    - checkpoint.json
