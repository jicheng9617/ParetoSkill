[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paretoskill"
version = "0.1.0"
description = "Offline-safe, regression-aware multi-objective skill evolution"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ParetoSkill contributors" }]
dependencies = [
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.13.2",
]

[project.scripts]
paretoskill = "paretoskill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
